name: Doxygen

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  doc-html:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v7

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen

    # Doxyfile.in only uses the project information and directories,
    # so there is no need to configure the project with CMake.
    - name: Generate Doxyfile
      run: |
        version=$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
        description=$(sed -n 's/^ *DESCRIPTION "\(.*\)")*$/\1/p' CMakeLists.txt | head -1)
        mkdir -p build/docs/doxygen
        sed -e "s|@CMAKE_PROJECT_NAME@|mfem-mgis|g" \
            -e "s|@CMAKE_PROJECT_VERSION@|${version}|g" \
            -e "s|@CMAKE_PROJECT_DESCRIPTION@|${description}|g" \
            -e "s|@PROJECT_SOURCE_DIR@|${{github.workspace}}|g" \
            -e "s|@PROJECT_BINARY_DIR@|${{github.workspace}}/build|g" \
            Doxyfile.in > build/Doxyfile

    - name: Generate doxygen
      working-directory: ${{github.workspace}}/build
      run: doxygen Doxyfile

    - name: Deploy
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.DEPLOY_TO_THELFER_GITHUB_IO }}
        publish_branch: master
        publish_dir: ${{github.workspace}}/build/docs/doxygen/html/
        external_repository: thelfer/thelfer.github.io
        destination_dir: mfem-mgis-doxygen/
