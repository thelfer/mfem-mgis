name: "Spack"

on:
  # Keep the build cache up to date with the latest dependencies
  schedule:
    - cron: 17 1 * * *

  # Allow manual trigger of a build
  workflow_dispatch:

  # Test the new commits of master, which update the build cache
  push:
    branches:
      - master

  # Test the pull requests, which only read the build cache
  pull_request:
    branches:
      - master

  # Test the published releases
  release:
    types: [published]

# one run at a time outside pull requests, since the runs on master clean the build
# cache, whereas a new commit pushed to a pull request cancels the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_CACHE: oci://ghcr.io/${{ github.repository_owner }}/mfem-mgis-spack-buildcache

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        spack:
          - {version: v1.1.0, packages: releases/v2025.11}
          - {version: v1.2.2, packages: develop}
        mpi: ["+mpi", "~mpi"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: ${{ matrix.spack.version }}      # Spack version
          packages_ref: ${{ matrix.spack.packages }}  # Spack packages (builtin repository) version
          buildcache: false # like users: its openblas+ilp64 breaks mumps~int64
          color: true       # Force color output (SPACK_COLOR=always)
          spack_path: spack # Where to clone Spack
      - name: Set up the build cache
        uses: ./.github/actions/setup-build-cache
      - name: Install the dependencies of MFEM MGIS
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the builtin repository only provides mfem-mgis since its develop version
          if [ "${{ matrix.spack.packages }}" != develop ]; then
            git clone https://github.com/rprat-pro/spack-repo-mfem-mgis.git
            spack repo add spack-repo-mfem-mgis
          fi
          # pin the master commits, otherwise older binaries from the cache would be reused
          tfel=$(git ls-remote https://github.com/thelfer/tfel.git refs/heads/master | cut -f1)
          mgis=$(git ls-remote https://github.com/thelfer/MFrontGenericInterfaceSupport.git refs/heads/master | cut -f1)
          env=${{ runner.temp }}/mfem-mgis-env
          spack env create -d $env
          spack -e $env add "mfem-mgis@master${{ matrix.mpi }} ^tfel@master commit=$tfel ^mgis@master commit=$mgis"
          # build the checked out sources rather than the master branch fetched by the
          # recipe, which only changes the hash of mfem-mgis, not of its dependencies
          spack -e $env develop --no-clone --path ${{ github.workspace }} mfem-mgis@master
          spack -e $env install --only dependencies
      # MFEM MGIS itself is never cached, so that it is always built and tested
      - name: Push the dependencies to the build cache
        if: github.ref == 'refs/heads/master'
        uses: ./.github/actions/push-build-cache
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifact: used-hashes-${{ matrix.spack.version }}${{ matrix.mpi }}
          exclude: mfem-mgis
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: spack-${{ matrix.spack.version }}${{ matrix.mpi }}
      - name: Install MFEM MGIS
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # only MFEM MGIS is compiled with ccache, the dependencies come from the build cache
          spack config add config:ccache:true
          spack -e ${{ runner.temp }}/mfem-mgis-env install --test=root
      # even when a test fails, so that the next run does not compile everything again
      - name: Save ccache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: ./.github/actions/save-ccache

  # a single update of the build cache once all the jobs have pushed, only on master
  update_build_cache:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: v1.2.2
          packages_ref: develop
          buildcache: false
          spack_path: spack
      - name: Clean the build cache
        uses: ./.github/actions/clean-build-cache
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prune: ${{ needs.build.result == 'success' }}
